version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
    ignore:
      # @astrojs/check 0.9.12 rejects TypeScript 7 (ERESOLVE in npm ci); remove when @astrojs/check accepts TypeScript 7.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
